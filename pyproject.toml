[project]
name = "arcane-engineering"
version = "0.1.0"
description = "Arcane circuit simulation and manim conversion, inspired by GorillaOfDestiny's Arcane Engineering"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
manim = ["manim"]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
