[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "arcane-engineering"
version = "1.0.0"
description = "Arcane circuit simulation, an interactive desktop studio, and manim rendering, inspired by GorillaOfDestiny's Arcane Engineering"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
gui = ["PySide6"]
manim = ["manim"]
dev = ["pytest", "PySide6"]

[project.scripts]
arcane-gui = "arcane.gui.app:main"
arcane-sim = "arcane.util.circuit_spec:main"

[tool.setuptools.packages.find]
include = ["arcane*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pycodestyle]
max-line-length = 100
